id: node.pwm_device.field_stop_switches
field_name: field_stop_switches
entity_type: node
bundle: pwm_device
label: 'Stop switches'
description: "Switches that cut this output the moment they close, and keep it from starting while one is closed. The opposite of \"Fast activation switch\", which runs the output while its switch is closed. The board acts on these itself, so a stop switch must be on the same I/O board as the output. Up to two.<br>\r\nThe main use is the end-of-stroke switch of a flipper whose power and hold windings are driven separately: set it on the power winding only. On WPC Fliptronic that switch is 111, 113, 115 or 117, and the ROM reads it as well. While the button is held, the board fires the power winding again when the switch opens - a ball has pushed the finger down - at most five times per press, so a chattering or misadjusted contact cannot keep a full-power winding going.<br>\r\nDo not use it for a motor the ROM drives, such as a gun on a crank. The ROM reads those position switches itself, and a motor parked on a stop switch could never be started again. It is only for a motor nothing else stops, which would otherwise drive into its own end stop.<br>\r\nIt does not replace a maximum pulse time: a contact can be unplugged or misadjusted, and the original machines paired one with a timeout rather than trusting it alone."
