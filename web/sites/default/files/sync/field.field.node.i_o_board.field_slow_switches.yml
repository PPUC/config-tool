bundle: i_o_board
label: 'Only slow switches'
description: 'Set this if none of the switches on this board need low latency - a board with only the start button, coin door, tilt and similar. Such a board is polled every eighth cycle instead of every cycle, which shortens every other cycle for the boards that do need it. Do not set it on a board carrying flipper buttons or playfield switches.'
