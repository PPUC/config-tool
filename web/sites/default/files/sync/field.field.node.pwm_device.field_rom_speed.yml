id: node.pwm_device.field_rom_speed
field_name: field_rom_speed
entity_type: node
bundle: pwm_device
label: 'Speed set by the ROM'
description: "Set this on a motor whose speed the ROM varies by pulsing its driver, such as Dirty Harry's gun, which gets faster as a game progresses. ppuc measures the pulses and the board runs the motor at that share of its power, after a short start at full power, so set the power to what the motor's supply was on the original: 64 for 12 V on a 48 V rail. Only for a motor. Leave it off for a motor that runs at one speed, such as T2's gun."
required: false
translatable: false
