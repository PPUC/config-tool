label: 'Runs without game on'
description: 'Set this if the ROM has to drive this output with no game running. A board discards coil commands while the game-on solenoid is off, but a ROM may still move an assembly then: Dirty Harry searches for its gun at boot and waits for the result. Only this one gate is lifted: opening the coin door still cuts the output. Leave it off for ordinary coils.'
