label: 'Dual-wound coil'
description: 'Set this if the coil has a separate hold winding and an end-of-stroke contact that transfers to it mechanically. Such a coil bounds itself, so it does not need a maximum pulse time or hold power. Do not set it on a single-winding coil: it turns off the warning that is the only thing standing between a stuck-on coil and a burnt winding.'
