id: node.i_o_board.field_first_in_chain
field_name: field_first_in_chain
entity_type: node
bundle: i_o_board
label: 'Answer first in the switch chain'
description: 'Set this on the board whose switches the ROM must answer fastest - typically the one carrying the optos in front of a diverter. Its switches then reach the ROM early in each cycle, so a coil fired in answer catches the next output frame instead of waiting a whole extra cycle. Mark one board, or very few: every board marked this way pushes the others back. Ignored on a board marked Only slow switches.'
required: false
translatable: false
