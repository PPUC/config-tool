label: Markers
description: 'Points on the photograph, as YAML. x and y run from 0 to 1 across the picture, so they survive it being scaled. pointer is the side the arrow comes in from - left, right, above or below - so it never covers what it points at. Numbered markers pulse in order, which is what makes a sequence readable. Example:<br /><code>- number: 1<br />&nbsp;&nbsp;x: 0.31<br />&nbsp;&nbsp;y: 0.62<br />&nbsp;&nbsp;pointer: left<br />- number: 2<br />&nbsp;&nbsp;x: 0.68<br />&nbsp;&nbsp;y: 0.44<br />&nbsp;&nbsp;pointer: below</code>'
